name: Verify claimant extraction
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-workbook-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile macOS utility
        run: swiftc src/claimants.swift -o /tmp/claimants
      - name: Check extraction using invented records
        env:
          CLAIMANTS_BINARY: /tmp/claimants
        run: python3 -m unittest discover -s tests -v
